# ==============================================================================
# Training Configuration
# ==============================================================================

training:

  # ---------------------------------------------------------------------------
  # General
  # ---------------------------------------------------------------------------

  experiment_name: "BrainTumorDiagnosis_2026"

  project_name: "HybridBrainTumorDiagnosis"

  random_seed: 42

  deterministic: true

  benchmark: true

  device: "cuda"

  gpu_id: 0

  mixed_precision: true

  compile_model: false

  # ---------------------------------------------------------------------------
  # Training
  # ---------------------------------------------------------------------------

  epochs: 100

  start_epoch: 0

  batch_size: 2

  gradient_accumulation_steps: 4

  gradient_clip:

    enabled: true

    max_norm: 1.0

  # ---------------------------------------------------------------------------
  # Optimizer
  # ---------------------------------------------------------------------------

  optimizer:

    name: "AdamW"

    learning_rate: 0.0001

    weight_decay: 0.00001

    betas:

      - 0.9

      - 0.999

    eps: 0.00000001

  # ---------------------------------------------------------------------------
  # Second Optimizer
  # ---------------------------------------------------------------------------

  alternative_optimizer:

    enabled: false

    name: "Lion"

    learning_rate: 0.0001

    weight_decay: 0.00001

  # ---------------------------------------------------------------------------
  # Scheduler
  # ---------------------------------------------------------------------------

  scheduler:

    name: "CosineAnnealingLR"

    t_max: 100

    eta_min: 0.0000001

  # ---------------------------------------------------------------------------
  # Alternative Scheduler
  # ---------------------------------------------------------------------------

  alternative_scheduler:

    enabled: false

    name: "OneCycleLR"

    max_lr: 0.001

  # ---------------------------------------------------------------------------
  # Loss Functions
  # ---------------------------------------------------------------------------

  losses:

    segmentation:

      dice_loss_weight: 0.7

      focal_loss_weight: 0.3

    classification:

      cross_entropy_weight: 1.0

  # ---------------------------------------------------------------------------
  # Validation
  # ---------------------------------------------------------------------------

  validation:

    validate_every: 1

    save_best_model: true

    monitor: "val_dice"

    mode: "max"

  # ---------------------------------------------------------------------------
  # Early Stopping
  # ---------------------------------------------------------------------------

  early_stopping:

    enabled: true

    patience: 15

    min_delta: 0.0001

  # ---------------------------------------------------------------------------
  # Checkpoints
  # ---------------------------------------------------------------------------

  checkpoint:

    directory: "outputs/checkpoints"

    save_every: 5

    save_last: true

    save_best: true

    resume: false

  # ---------------------------------------------------------------------------
  # TensorBoard
  # ---------------------------------------------------------------------------

  tensorboard:

    enabled: true

    directory: "outputs/logs/tensorboard"

  # ---------------------------------------------------------------------------
  # Weights & Biases
  # ---------------------------------------------------------------------------

  wandb:

    enabled: false

    project: "BrainTumorDiagnosis"

    entity: ""

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------

  logging:

    print_every: 10

    save_log_file: true

    log_directory: "outputs/logs"

  # ---------------------------------------------------------------------------
  # Output
  # ---------------------------------------------------------------------------

  outputs:

    prediction_directory: "outputs/predictions"

    metrics_directory: "outputs/metrics"

    figure_directory: "outputs/figures"

  # ---------------------------------------------------------------------------
  # Performance Metrics
  # ---------------------------------------------------------------------------

  metrics:

    - accuracy
    - precision
    - recall
    - f1_score
    - dice
    - iou
    - roc_auc

  # ---------------------------------------------------------------------------
  # Reproducibility
  # ---------------------------------------------------------------------------

  reproducibility:

    numpy_seed: 42

    torch_seed: 42

    cudnn_deterministic: true

    cudnn_benchmark: true