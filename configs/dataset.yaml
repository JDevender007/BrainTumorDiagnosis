# ==============================================================================
# BraTS 2024 Dataset Configuration
# ==============================================================================

dataset:

  # ---------------------------------------------------------------------------
  # Dataset Path
  # ---------------------------------------------------------------------------

  root: "data/raw/BraTS2024"

  cache_dir: "data/cache"

  processed_dir: "data/processed"

  split_dir: "data/splits"

  # ---------------------------------------------------------------------------
  # MRI Modalities
  # ---------------------------------------------------------------------------

  modalities:

    - t1n
    - t1c
    - t2w
    - t2f

  segmentation: true

  # ---------------------------------------------------------------------------
  # Image Information
  # ---------------------------------------------------------------------------

  image:

    dimensions: 3

    channels: 4

    original_size:

      x: 240
      y: 240
      z: 155

    resize:

      x: 128
      y: 128
      z: 128

    interpolation: "trilinear"

  # ---------------------------------------------------------------------------
  # Normalization
  # ---------------------------------------------------------------------------

  normalization:

    method: "zscore"

    clip_percentile:

      lower: 0.5
      upper: 99.5

  # ---------------------------------------------------------------------------
  # Preprocessing
  # ---------------------------------------------------------------------------

  preprocessing:

    skull_stripping: false

    bias_field_correction: false

    foreground_crop: true

    orientation: "RAS"

    resample_spacing:

      x: 1.0
      y: 1.0
      z: 1.0

  # ---------------------------------------------------------------------------
  # Data Augmentation
  # ---------------------------------------------------------------------------

  augmentation:

    enabled: true

    flip_probability: 0.50

    rotation_probability: 0.30

    gaussian_noise_probability: 0.20

    intensity_shift_probability: 0.20

    zoom_probability: 0.20

  # ---------------------------------------------------------------------------
  # Dataset Split
  # ---------------------------------------------------------------------------

  split:

    train: 0.70

    validation: 0.15

    test: 0.15

    random_seed: 42

  # ---------------------------------------------------------------------------
  # Data Loader
  # ---------------------------------------------------------------------------

  dataloader:

    batch_size: 2

    num_workers: 4

    shuffle: true

    pin_memory: true

    persistent_workers: true

    prefetch_factor: 2

  # ---------------------------------------------------------------------------
  # File Extensions
  # ---------------------------------------------------------------------------

  supported_extensions:

    - ".nii"

    - ".nii.gz"

  # ---------------------------------------------------------------------------
  # Labels
  # ---------------------------------------------------------------------------

  labels:

    background: 0

    necrotic_non_enhancing: 1

    edema: 2

    enhancing_tumor: 3

  # ---------------------------------------------------------------------------
  # Logging
  # ---------------------------------------------------------------------------

  logging:

    verbose: true