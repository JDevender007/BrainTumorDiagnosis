# BrainTumorDiagnosis
# Classification baseline configuration (unified trainer).
#
# Supported backbones: cnn2d, densenet121, resnet50,
#                      efficientnet_v2_s, convnext_tiny, swin_t
#
# Protocol note: the validation split is held out from the official
# training data (stratified per class, deterministic seed). The
# official Test split is NEVER used for validation and is evaluated
# only after training.

model:
  backbone: cnn2d
  num_classes: 4
  input_channels: 3
  image_size: [224, 224]
  pretrained: false
  label_smoothing: 0.0
  use_class_weights: true
  use_augmentation: true

data:
  data_directory: data/raw/classification
  validation_split: 0.2
  validation_seed: 42
  batch_size: 16
  num_workers: 0

training:
  epochs: 30
  learning_rate: 0.0001
  weight_decay: 0.0001
  use_amp: true
  seed: 42
  patience: 7
  min_delta: 0.001
  grad_accumulation_steps: 1
  grad_clip: 1.0

paths:
  model_directory: checkpoints/classification/cnn2d
  result_directory: outputs/classification_training